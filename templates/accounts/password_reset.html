{% extends "base.html" %}

{% block content %}
<section class="section-content padding-y">
    <div class="card mx-auto" style="max-width: 480px; margin-top: 40px;">
        <article class="card-body">
            <h4 class="card-title mb-3">Reset your password</h4>
            <p>Enter the email address used for your account. If it exists, we will send a reset link.</p>
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="{{ form.email.id_for_label }}">Email</label>
                    {{ form.email }}
                    {{ form.email.errors }}
                </div>
                <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
            </form>
        </article>
    </div>
</section>
{% endblock %}
